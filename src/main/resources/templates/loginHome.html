<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{nav.brand}">Spring Shop</title>
  <link th:href="@{/css/bootstrap.min.css}" href="../static/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Spring Shop</a>
    <form class="d-flex align-items-center" th:action="@{/logout}" method="post">
      <span class="navbar-text me-3" th:text="#{nav.greeting(${member.name})}">테스터님</span>
      <button class="btn btn-outline-light btn-sm" type="submit" th:text="#{nav.logout}">로그아웃</button>
    </form>
  </div>
</nav>
<main class="container my-5">
  <section class="card shadow-sm mx-auto" style="max-width: 36rem;">
    <div class="card-body p-5 text-center">
      <h1 class="h3 mb-3" th:text="#{home.member.title(${member.name})}">테스터님, 어서 오세요</h1>
      <p class="text-muted" th:text="#{home.member.lead}">상품 목록으로 이동하거나 로그아웃할 수 있습니다.</p>
      <a class="btn btn-primary" th:href="@{/items}" th:text="#{nav.items}">상품</a>
    </div>
  </section>
</main>
</body>
</html>
