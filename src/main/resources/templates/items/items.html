<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{items.title}">상품 목록</title>
  <link th:href="@{/css/bootstrap.min.css}" href="../../static/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Spring Shop</a>
    <form th:action="@{/logout}" method="post">
      <button class="btn btn-outline-light btn-sm" type="submit" th:text="#{nav.logout}">로그아웃</button>
    </form>
  </div>
</nav>
<main class="container my-5" style="max-width: 48rem;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0" th:text="#{items.title}">상품 목록</h1>
    <a class="btn btn-primary btn-sm" th:href="@{/items/add}" th:text="#{action.add}">새 상품 추가</a>
  </div>
  <div class="card shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
      <tr>
        <th scope="col" th:text="#{id}">번호</th>
        <th scope="col" th:text="#{itemName}">상품 이름</th>
        <th scope="col" class="text-end" th:text="#{price}">판매 가격</th>
        <th scope="col" class="text-end" th:text="#{quantity}">재고 수량</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${items}">
        <td th:text="${row.id}">1</td>
        <td><a th:href="@{/items/{id}(id=${row.id})}" th:text="${row.itemName}">itemA</a></td>
        <td class="text-end" th:text="${#numbers.formatInteger(row.price, 1, 'COMMA')}">10,000</td>
        <td class="text-end" th:text="${row.quantity}">10</td>
      </tr>
      <tr th:if="${#lists.isEmpty(items)}">
        <td colspan="4" class="text-center text-muted py-4" th:text="#{items.empty}">등록된 상품이 없습니다.</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
