<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{item.add.title}">새 상품 등록</title>
  <link th:href="@{/css/bootstrap.min.css}" href="../../static/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Spring Shop</a>
    <form th:action="@{/logout}" method="post">
      <button class="btn btn-outline-light btn-sm" type="submit" th:text="#{nav.logout}">로그아웃</button>
    </form>
  </div>
</nav>
<main class="container my-5" style="max-width: 36rem;">
  <section class="card shadow-sm">
    <div class="card-header" th:text="#{item.add.title}">새 상품 등록</div>
    <form class="card-body" th:action="@{/items/add}" th:object="${item}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label" for="itemName" th:text="#{itemName}">상품 이름</label>
        <input class="form-control" type="text" id="itemName" th:field="*{itemName}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{itemName}">오류</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="price" th:text="#{price}">판매 가격</label>
        <input class="form-control" type="text" inputmode="numeric" id="price" th:field="*{price}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{price}">오류</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="quantity" th:text="#{quantity}">재고 수량</label>
        <input class="form-control" type="text" inputmode="numeric" id="quantity" th:field="*{quantity}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{quantity}">오류</div>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/items}" th:text="#{action.cancel}">취소</a>
        <button class="btn btn-primary" type="submit" th:text="#{action.save}">저장하기</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
